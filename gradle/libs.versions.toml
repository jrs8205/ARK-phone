[versions]
agp = "9.2.0"
kotlin = "2.3.21"
ksp = "2.3.10"
hilt = "2.59.2"
hiltNavigationCompose = "1.3.0"
composeBom = "2026.06.01"
activityCompose = "1.12.2"
